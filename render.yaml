services:
  - type: web
    name: evitrace-backend
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/evitrace-backend-1.0.0.jar
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: FILE_UPLOAD_DIR
        value: /opt/render/project/uploads
      - key: SERVER_PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-domain.netlify.app  # ← replace with your actual frontend URL
    healthCheckPath: /actuator/health

