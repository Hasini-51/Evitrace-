spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 512MB

  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/evitracedb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}   # 24 hours in ms
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days

  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}

logging:
  level:
    com.evitrace: DEBUG
    org.springframework.security: WARN

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/evitrace}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
